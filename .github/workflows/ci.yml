name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typy, testy, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Sprawdzenie typów
        run: npm run typecheck
      - name: Testy (silnik triage, badanie, ocena, scenariusze)
        run: npm test
      - name: Build produkcyjny
        run: npm run build
