<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Próbka 3D pixel</title>
<style>
  body { background: #1a1c2c; color: #94b0c2; font-family: monospace; margin: 16px; font-size: 12px; }
  canvas { image-rendering: pixelated; width: 960px; height: 540px; display: block; }
  label { margin-right: 16px; }
</style>
</head>
<body>
<p>3D + filtr pixel art · przeciągnij myszą, aby obrócić kamerę</p>
<p>
  <label><input type="radio" name="res" value="480" checked> 480×270</label>
  <label><input type="radio" name="res" value="320"> 320×180</label>
  <label><input type="radio" name="res" value="960"> bez filtra (960×540)</label>
  <label><input type="checkbox" id="spin" checked> obrót</label>
</p>
<canvas id="c"></canvas>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.BasicShadowMap;
function setRes(w) { renderer.setPixelRatio(1); renderer.setSize(w, w * 9 / 16, false); }
setRes(480);
document.querySelectorAll('input[name=res]').forEach(r => r.onchange = () => setRes(+r.value));

const scene = new THREE.Scene();
scene.background = new THREE.Color('#1a1c2c');

// Kamera ortograficzna — widok izometryczny
const S = 9;
const camera = new THREE.OrthographicCamera(-S * 16 / 9, S * 16 / 9, S, -S, 0.1, 200);
let angle = Math.PI / 4;
function placeCamera() {
  camera.position.set(Math.cos(angle) * 30, 24, Math.sin(angle) * 30);
  camera.lookAt(0, 0, 0);
}
placeCamera();

scene.add(new THREE.HemisphereLight('#c8d8ff', '#3a3a2a', 1.2));
const sun = new THREE.DirectionalLight('#fff2d0', 2.2);
sun.position.set(10, 20, 6); sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -20, right: 20, top: 20, bottom: -20 });
scene.add(sun);

const mat = c => new THREE.MeshLambertMaterial({ color: c });
function box(w, h, d, color, x, y, z, parent = scene) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(color));
  m.position.set(x, y, z); m.castShadow = m.receiveShadow = true;
  parent.add(m); return m;
}

// Teren
box(30, 0.2, 30, '#3f7a3a', 0, -0.1, 0);
box(30, 0.21, 5, '#4a4e5a', 0, -0.09, 0);
for (let x = -14; x < 15; x += 3) box(1.2, 0.22, 0.2, '#e8eaa0', x, -0.08, 0);

// Autobus
const bus = new THREE.Group(); scene.add(bus);
box(11, 3, 3, '#e8c547', 0, 1.9, 0, bus);
box(11.05, 0.25, 3.05, '#1a1c2c', 0, 0.55, 0, bus);
for (let i = 0; i < 6; i++) box(1.2, 1, 3.06, '#29366f', -4 + i * 1.7, 2.4, 0, bus);
for (const x of [-3.5, 3.5]) for (const z of [-1.4, 1.4]) {
  const w = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.6, 0.4, 10), mat('#1a1c2c'));
  w.rotation.x = Math.PI / 2; w.position.set(x, 0.6, z); bus.add(w);
}
bus.rotation.y = 0.35; bus.position.set(-3, 0, -0.5);
bus.rotation.z = 0.08;

// Postać z prostych brył
function person({ shirt, pants, hair, skin = '#f4c19a', scale = 1, stripes = false }) {
  const g = new THREE.Group();
  box(0.35, 0.9, 0.35, pants, -0.2, 0.45, 0, g); box(0.35, 0.9, 0.35, pants, 0.2, 0.45, 0, g);
  const torso = box(0.9, 1.0, 0.5, shirt, 0, 1.4, 0, g);
  if (stripes) { box(0.92, 0.12, 0.52, '#e8eaa0', 0, 1.2, 0, g); box(0.37, 0.1, 0.37, '#e8eaa0', -0.2, 0.3, 0, g); box(0.37, 0.1, 0.37, '#e8eaa0', 0.2, 0.3, 0, g); }
  box(0.25, 0.9, 0.3, shirt, -0.6, 1.4, 0, g); box(0.25, 0.9, 0.3, shirt, 0.6, 1.4, 0, g);
  box(0.6, 0.6, 0.6, skin, 0, 2.2, 0, g); box(0.64, 0.2, 0.64, hair, 0, 2.5, 0, g);
  g.scale.setScalar(scale); g.userData.torso = torso;
  scene.add(g); return g;
}
function lying(p, x, z, rot) { p.rotation.set(-Math.PI / 2, 0, rot); p.position.set(x, 0.3 * p.scale.x, z); return p; }
function tag(color, x, z, h) {
  box(0.06, h, 0.06, '#1a1c2c', x, h / 2, z);
  box(0.6, 0.4, 0.06, color, x + 0.3, h - 0.2, z);
}

const patients = [
  lying(person({ shirt: '#3b5dc9', pants: '#41506b', hair: '#5a3b2a' }), 5, 5, 0.6),
  lying(person({ shirt: '#f2a23c', pants: '#41506b', hair: '#e0b050', scale: 0.6 }), 2, 4.5, -0.4),
  lying(person({ shirt: '#7a3b8a', pants: '#333c57', hair: '#1a1c2c' }), -6, 5, 1.2),
  lying(person({ shirt: '#3fa34d', pants: '#41506b', hair: '#5a3b2a', scale: 0.6 }), 7, -4, 2.0),
  lying(person({ shirt: '#c0c0c0', pants: '#333c57', hair: '#808080' }), -8, -5, 0.2),
];
box(0.8, 0.05, 0.8, '#a01c1c', 5.3, 0.02, 5.6);
tag('#d6303a', 6.2, 4.4, 1.6); tag('#e8c547', 2.8, 4, 1.4); tag('#3fa34d', 7.6, -3.4, 1.4); tag('#1a1c2c', -7, -5, 1.6);

const medic = person({ shirt: '#d6303a', pants: '#8f1d2c', hair: '#5a3b2a', stripes: true });
medic.position.set(3, 0, 2.5); medic.rotation.y = -0.8;

// Obrót myszą
let drag = null;
canvas.onpointerdown = e => drag = e.clientX;
window.onpointerup = () => drag = null;
window.onpointermove = e => { if (drag !== null) { angle += (e.clientX - drag) * 0.01; drag = e.clientX; placeCamera(); } };

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime();
  if (document.getElementById('spin').checked && drag === null) { angle += 0.003; placeCamera(); }
  // „oddech" — skala klatki piersiowej (podgląd tego, co da się później zrobić)
  patients.forEach((p, i) => { if (i !== 4) p.userData.torso.scale.z = 1 + Math.sin(t * (2 + i)) * 0.15; });
  renderer.render(scene, camera);
});
</script>
</body>
</html>
