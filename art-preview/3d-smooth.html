<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Próbka 3D pixel v2</title>
<style>
  body { background: #1a1c2c; color: #94b0c2; font-family: monospace; margin: 16px; font-size: 12px; }
  canvas { image-rendering: pixelated; width: 100%; max-width: 1280px; aspect-ratio: 16 / 9; display: block; }
  label { margin-right: 16px; }
</style>
</head>
<body>
<p>3D + filtr pixel art (wersja 2) · przeciągnij myszą, aby obrócić · kółko = zoom</p>
<p>
  <label><input type="radio" name="res" value="640" checked> 640×360</label>
  <label><input type="radio" name="res" value="480"> 480×270</label>
  <label><input type="radio" name="res" value="1280"> bez filtra</label>
  <label><input type="checkbox" id="outline" checked> kontur</label>
  <label><input type="checkbox" id="spin"> obrót</label>
</p>
<canvas id="c"></canvas>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const NEAR = 0.1, FAR = 80;
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;

// --- Post-process: kontur z bufora głębokości ---
const post = new THREE.ShaderMaterial({
  uniforms: { tDiffuse: { value: null }, tDepth: { value: null }, res: { value: new THREE.Vector2() }, outline: { value: 1 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse, tDepth; uniform vec2 res; uniform float outline; varying vec2 vUv;
    float D(vec2 o){ return texture2D(tDepth, vUv + o / res).r * ${(FAR - NEAR).toFixed(1)}; }
    void main(){
      vec4 c = texture2D(tDiffuse, vUv);
      float d = D(vec2(0.0));
      float e = max(0.0, d - D(vec2(1.0,0.0))) + max(0.0, d - D(vec2(-1.0,0.0)))
              + max(0.0, d - D(vec2(0.0,1.0))) + max(0.0, d - D(vec2(0.0,-1.0)));
      if (outline > 0.5 && e > 0.35) c.rgb = mix(c.rgb, vec3(0.06, 0.06, 0.1), 0.75);
      gl_FragColor = c;
      #include <colorspace_fragment>
    }`,
  depthTest: false, depthWrite: false,
});
const postScene = new THREE.Scene();
postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), post));
const postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

let rt;
function setRes(w) {
  const h = Math.round(w * 9 / 16);
  renderer.setSize(w, h, false);
  rt?.dispose();
  rt = new THREE.WebGLRenderTarget(w, h, { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter });
  rt.depthTexture = new THREE.DepthTexture(w, h);
  post.uniforms.tDiffuse.value = rt.texture;
  post.uniforms.tDepth.value = rt.depthTexture;
  post.uniforms.res.value.set(w, h);
}
setRes(640);
document.querySelectorAll('input[name=res]').forEach(r => r.onchange = () => setRes(+r.value));
document.getElementById('outline').onchange = e => post.uniforms.outline.value = e.target.checked ? 1 : 0;

// --- Scena ---
const scene = new THREE.Scene();
scene.background = new THREE.Color('#9fc4d8');
let zoom = 3.5;
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, NEAR, FAR);
let angle = Math.PI * 0.3;
function placeCamera() {
  Object.assign(camera, { left: -zoom * 16 / 9, right: zoom * 16 / 9, top: zoom, bottom: -zoom });
  camera.updateProjectionMatrix();
  camera.position.set(1 + Math.cos(angle) * 25, 20, 3.5 + Math.sin(angle) * 25);
  camera.lookAt(1, 0, 3.5);
}
placeCamera();

scene.add(new THREE.HemisphereLight('#d8e6ff', '#4a4a3a', 1.4));
const sun = new THREE.DirectionalLight('#fff0d8', 2.6);
sun.position.set(8, 18, 10); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0005;
Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 16, bottom: -16 });
scene.add(sun);

const gm = new THREE.DataTexture(new Uint8Array([80, 160, 255]), 3, 1, THREE.RedFormat);
gm.minFilter = gm.magFilter = THREE.NearestFilter; gm.needsUpdate = true;
const toon = c => new THREE.MeshToonMaterial({ color: c, gradientMap: gm });

function part(geo, color, parent = scene, x = 0, y = 0, z = 0) {
  const m = new THREE.Mesh(geo, toon(color));
  m.position.set(x, y, z); m.castShadow = m.receiveShadow = true;
  parent.add(m); return m;
}
const box = (w, h, d, c, x, y, z, p) => part(new THREE.BoxGeometry(w, h, d), c, p, x, y, z);
const joint = (p, x, y, z) => { const g = new THREE.Group(); g.position.set(x, y, z); p.add(g); return g; };
function limbGeo(r, len) { const g = new THREE.CapsuleGeometry(r, len, 4, 10); g.translate(0, -(len / 2 + r), 0); return g; }

// --- Teren ---
box(40, 0.2, 40, '#5f9a4a', 0, -0.1, 0);
box(40, 0.22, 6, '#55585f', 0, -0.09, 0);
box(40, 0.3, 0.3, '#a8a8a0', 0, 0, 3.15); box(40, 0.3, 0.3, '#a8a8a0', 0, 0, -3.15);
for (let x = -18; x < 19; x += 3) box(1.4, 0.23, 0.18, '#f0f0e0', x, -0.08, 0);
// trawa
for (let i = 0; i < 120; i++) {
  const x = (Math.sin(i * 91.7) * 0.5 + 0.5) * 36 - 18, z = (Math.sin(i * 37.3) * 0.5 + 0.5) * 30 - 15;
  if (Math.abs(z) < 3.6) continue;
  part(new THREE.ConeGeometry(0.08, 0.3, 4), i % 3 ? '#4f8a3c' : '#77b05a', scene, x, 0.15, z);
}

// --- Autobus (z zaokrąglonymi krawędziami: kapsuła na dachu) ---
const bus = new THREE.Group(); scene.add(bus);
box(10, 2.6, 2.6, '#f2c230', 0, 1.8, 0, bus);
const roof = part(new THREE.CapsuleGeometry(1.3, 7.4, 6, 12), '#f2c230', bus, 0, 2.9, 0);
roof.rotation.z = Math.PI / 2; roof.scale.set(0.35, 1, 1);
box(10.05, 0.35, 2.65, '#2a2a2e', 0, 0.62, 0, bus);
for (let i = 0; i < 7; i++) box(1.0, 0.9, 2.66, '#3d5470', -4 + i * 1.25, 2.3, 0, bus);
box(0.1, 1.2, 2.2, '#3d5470', 5.0, 2.2, 0, bus);
for (const x of [-3.4, 3.4]) for (const z of [-1.3, 1.3]) {
  const w = part(new THREE.CylinderGeometry(0.55, 0.55, 0.35, 14), '#22232a', bus, x, 0.55, z);
  w.rotation.x = Math.PI / 2;
}
bus.position.set(-4.5, 0.15, -0.8); bus.rotation.set(0, 0.3, 0.12);

// --- Osobowe auto ---
const car = new THREE.Group(); scene.add(car);
box(3.6, 0.8, 1.7, '#b03a3a', 0, 0.75, 0, car);
const cab = part(new THREE.CapsuleGeometry(0.6, 1.0, 4, 10), '#b03a3a', car, -0.2, 1.25, 0);
cab.rotation.z = Math.PI / 2; cab.scale.set(0.8, 1, 1.35);
box(1.4, 0.5, 1.72, '#3d5470', -0.2, 1.35, 0, car);
for (const x of [-1.2, 1.2]) for (const z of [-0.85, 0.85]) {
  const w = part(new THREE.CylinderGeometry(0.36, 0.36, 0.25, 12), '#22232a', car, x, 0.36, z);
  w.rotation.x = Math.PI / 2;
}
car.position.set(5, 0, -1.6); car.rotation.y = -0.9;
for (let i = 0; i < 14; i++) box(0.15, 0.05, 0.12, '#cfe3ea', 3 + Math.sin(i * 3) * 1.5, 0.02, -0.2 + Math.cos(i * 5) * 1.2);

// --- Postać ---
function human({ skin = '#f1c27d', shirt, pants, hair, shoes = '#2a2a2e', sleeves = false, child = false, stripes = false }) {
  const root = new THREE.Group(); scene.add(root);
  const body = joint(root, 0, 1.0, 0);
  const pelvis = part(new THREE.SphereGeometry(0.17, 12, 8), pants, body); pelvis.scale.set(1.15, 0.8, 0.8);
  const torso = part(new THREE.CapsuleGeometry(0.17, 0.32, 4, 12), shirt, body, 0, 0.36, 0); torso.scale.set(1.25, 1, 0.75);
  if (stripes) { const s = part(new THREE.CylinderGeometry(0.215, 0.215, 0.07, 14), '#f0f0b0', body, 0, 0.25, 0); s.scale.z = 0.75; }
  part(new THREE.CylinderGeometry(0.055, 0.06, 0.1, 8), skin, body, 0, 0.64, 0);
  const hr = child ? 0.15 : 0.12;
  const head = joint(body, 0, 0.66 + hr, 0);
  part(new THREE.SphereGeometry(hr, 14, 10), skin, head).scale.set(0.92, 1.08, 1);
  part(new THREE.ConeGeometry(0.022, 0.05, 6), skin, head, 0, -0.01, hr * 0.98).rotation.x = Math.PI / 2;
  part(new THREE.SphereGeometry(hr * 1.07, 14, 10, 0, Math.PI * 2, 0, Math.PI * 0.55), hair, head, 0, 0.01, -0.012).scale.set(0.95, 1.08, 1.05);
  for (const s of [-1, 1]) part(new THREE.SphereGeometry(0.016, 6, 4), '#1a1c2c', head, s * 0.045, 0.02, hr * 0.92);
  const arms = [], legs = [];
  for (const s of [-1, 1]) {
    const sh = joint(body, s * 0.25, 0.52, 0);
    part(limbGeo(0.058, 0.2), shirt, sh);
    const el = joint(sh, 0, -0.316, 0);
    part(limbGeo(0.05, 0.19), sleeves ? shirt : skin, el);
    part(new THREE.SphereGeometry(0.055, 8, 6), skin, el, 0, -0.32, 0);
    arms.push({ sh, el });
    const hip = joint(body, s * 0.1, -0.05, 0);
    part(limbGeo(0.08, 0.3), pants, hip);
    const knee = joint(hip, 0, -0.46, 0);
    part(limbGeo(0.068, 0.3), pants, knee);
    if (stripes) part(new THREE.CylinderGeometry(0.075, 0.075, 0.05, 10), '#f0f0b0', knee, 0, -0.25, 0);
    const shoe = part(new THREE.CapsuleGeometry(0.06, 0.1, 4, 8), shoes, knee, 0, -0.47, 0.04);
    shoe.rotation.x = Math.PI / 2;
    legs.push({ hip, knee });
  }
  root.scale.setScalar(child ? 0.6 : 0.92);
  return { root, body, torso, head, arms, legs };
}

function lyingBack(h, { x, z, rotY, kneeUp = -1, armOut = [0.35, 0.35] }) {
  h.body.position.y = 0.14; h.body.rotation.x = -Math.PI / 2;
  h.arms.forEach((a, i) => { a.sh.rotation.z = (i ? 1 : -1) * armOut[i]; });
  if (kneeUp >= 0) { h.legs[kneeUp].hip.rotation.x = -0.8; h.legs[kneeUp].knee.rotation.x = 1.4; }
  h.root.position.set(x, 0, z); h.root.rotation.y = rotY;
  return h;
}
function lyingFront(h, { x, z, rotY }) {
  h.body.position.y = 0.15; h.body.rotation.x = Math.PI / 2;
  h.head.rotation.y = 1.2;
  h.arms[0].sh.rotation.z = -1.4; h.arms[0].el.rotation.z = -1.2;
  h.arms[1].sh.rotation.z = 0.3;
  h.legs[1].hip.rotation.z = 0.25; h.legs[1].hip.rotation.x = -0.5; h.legs[1].knee.rotation.x = 0.9;
  h.root.position.set(x, 0, z); h.root.rotation.y = rotY;
  return h;
}
function sitting(h, { x, z, rotY }) {
  h.body.position.y = 0.2;
  h.legs.forEach(l => { l.hip.rotation.x = -1.3; l.knee.rotation.x = 1.6; });
  h.body.rotation.x = 0.2;
  h.arms.forEach((a, i) => { a.sh.rotation.x = -0.9; a.el.rotation.x = -0.9; a.sh.rotation.z = (i ? -1 : 1) * 0.25; });
  h.head.rotation.x = 0.5;
  h.root.position.set(x, 0, z); h.root.rotation.y = rotY;
  return h;
}
function kneeling(h, { x, z, rotY }) {
  h.body.position.y = 0.56; h.body.rotation.x = 0.35;
  h.legs[0].hip.rotation.x = -1.5; h.legs[0].knee.rotation.x = 1.5;
  h.legs[1].hip.rotation.x = 0.1; h.legs[1].knee.rotation.x = 1.5;
  h.arms.forEach(a => { a.sh.rotation.x = -1.0; a.el.rotation.x = -0.5; });
  h.head.rotation.x = 0.4;
  h.root.position.set(x, 0, z); h.root.rotation.y = rotY;
  return h;
}

const tag = (color, x, z) => { box(0.05, 1.4, 0.05, '#2a2a2e', x, 0.7, z); box(0.5, 0.32, 0.04, color, x + 0.27, 1.24, z); };

const p1 = lyingBack(human({ shirt: '#3b5dc9', pants: '#41506b', hair: '#5a3b2a' }), { x: 2.2, z: 4.6, rotY: 0.5, kneeUp: 0 });
const p2 = lyingBack(human({ shirt: '#f2a23c', pants: '#41506b', hair: '#e0b050', child: true }), { x: -1.5, z: 4.8, rotY: -0.7, armOut: [0.9, 0.2] });
const p3 = lyingFront(human({ shirt: '#7a3b8a', pants: '#333c57', hair: '#1a1c2c' }), { x: -6, z: 4.2, rotY: 1.9 });
const p4 = sitting(human({ shirt: '#3fa34d', pants: '#41506b', hair: '#5a3b2a', child: true }), { x: 6.5, z: 4.4, rotY: -2.4 });
const p5 = lyingBack(human({ shirt: '#d0d0d0', pants: '#333c57', hair: '#9a9a9a', skin: '#c68e5f' }), { x: 2, z: -4.8, rotY: 2.6, armOut: [1.2, 0.1], kneeUp: 1 });
part(new THREE.CircleGeometry(0.45, 10), '#8a1414', scene, 2.5, 0.03, 4.0).rotation.x = -Math.PI / 2;

kneeling(human({ shirt: '#d6303a', pants: '#8f1d2c', hair: '#3a2a20', sleeves: true, stripes: true }), { x: 3.3, z: 3.6, rotY: -2.0 });

tag('#d6303a', 1.4, 5.4); tag('#e8c547', -2.4, 5.4); tag('#3fa34d', 7.2, 5.2); tag('#2a2a2e', 1.2, -5.6);

const patients = [p1, p2, p5];

// --- Sterowanie ---
let drag = null;
canvas.onpointerdown = e => drag = e.clientX;
window.onpointerup = () => drag = null;
window.onpointermove = e => { if (drag !== null) { angle += (e.clientX - drag) * 0.01; drag = e.clientX; placeCamera(); } };
canvas.onwheel = e => { e.preventDefault(); zoom = Math.min(12, Math.max(2.5, zoom + Math.sign(e.deltaY) * 0.5)); placeCamera(); };

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime();
  if (document.getElementById('spin').checked && drag === null) { angle += 0.003; placeCamera(); }
  patients.forEach((p, i) => { p.torso.scale.z = 0.75 * (1 + Math.sin(t * (2.2 + i * 1.3)) * 0.12); });
  renderer.setRenderTarget(rt); renderer.render(scene, camera);
  renderer.setRenderTarget(null); renderer.render(postScene, postCam);
});
</script>
</body>
</html>
